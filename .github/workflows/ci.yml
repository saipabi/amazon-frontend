name: Frontend CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Next.js Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci || npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://amazon-backend-wuf3.onrender.com/api
